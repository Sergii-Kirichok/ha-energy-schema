name: Energy Schema
version: "0.6.53"
slug: energy_schema
description: Живая однолинейная схема энергосистемы BobRIXOS (Go renderer)
url: https://github.com/Sergii-Kirichok/ha-energy-schema
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:home-lightning-bolt
panel_title: Энергосхема
homeassistant_api: true
map:
  - homeassistant_config:rw
options:
  title: "Энергосистема"
  in1_name: "Рыбхоз"
  in2_name: "Зелёный"
  pv1_label: "Поле 1"
  pv2_label: "Поле 2"
  pv3_label: "Поле 3"
  batt_capacity_kwh: 60
  home_max: 30
  home_t1: 3
  home_t2: 5
  home_t3: 25
  pv_max: 33
  pv_t1: 5
  pv_t2: 20
  pv_t3: 25
  pv_day_clear_kwh: 100
  pv_ac_limit_kw: 33
  pv_strings:
    - name: "Поле 1"
      field: "Поле 1"
      kwp: 6.45
      tilt: 51
      azimuth: 122
      bifacial: 0.12
      controllable: false
    - name: "Забор"
      field: "Забор"
      kwp: 7.44
      tilt: 90
      azimuth: 76
      bifacial: 0
      controllable: false
  refresh_seconds: 3
  control_users: []
  bms_dashboard: "home-energy"
  ha_url: "http://homeassistant:8123"
  ha_token: ""
schema:
  title: str?
  in1_name: str?
  in2_name: str?
  pv1_label: str?
  pv2_label: str?
  pv3_label: str?
  batt_capacity_kwh: float?
  home_max: float?
  home_t1: float?
  home_t2: float?
  home_t3: float?
  pv_max: float?
  pv_t1: float?
  pv_t2: float?
  pv_t3: float?
  pv_day_clear_kwh: float?
  pv_ac_limit_kw: float?
  pv_strings:
    - name: str
      field: str?
      kwp: float
      tilt: float
      azimuth: float
      bifacial: float?
      controllable: bool?
  charge_max_a_limit: float(1,185)?
  charge_grid_a_limit: float(1,185)?
  charge_full_days_max: int(1,90)?
  charge_night_below_w: int(0,20000)?
  charge_day_above_w: int(0,20000)?
  charge_cell_cap_a: float(1,185)?
  charge_cell_cap_soc: int(0,100)?
  charge_full_tail_soc: int(50,100)?
  charge_full_tail_a: float(1,185)?
  charge_zero_on_target: bool?
  charge_balance_stop_v: float(3.4,3.65)?
  charge_balance_soft_mv: int(3,100)?
  charge_balance_soft_v: float(3.3,3.6)?
  charge_balance_pause_min: int(10,600)?
  charge_balance_resume_v: float(3.3,3.55)?
  charge_balance_resume_soc: int(90,99)?
  charge_balance_done_mv: int(5,200)?
  charge_balance_max_days: int(1,14)?
  charge_balance_max_cycles: int(1,50)?
  refresh_seconds: int(1,60)
  control_users:
    - str?
  bms_dashboard: str?
  ha_url: str?
  ha_token: str?
