configuration:
  title:
    name: "Title"
    description: "Currently not shown anywhere (kept for compatibility). Default «Энергосистема»."
  in1_name:
    name: "Input 1: name"
    description: "Label of the first grid input on the schematic (input block, ATS, input selector). Default «Рыбхоз»."
  in2_name:
    name: "Input 2: name"
    description: "Label of the second grid input on the schematic (input block, ATS, input selector). Default «Зелёный»."
  pv1_label:
    name: "PV: field 1 label"
    description: "Caption under the first PV field gauge. Default «Поле 1»."
  pv2_label:
    name: "PV: field 2 label"
    description: "Caption under the second PV field gauge. Default «Поле 2»."
  pv3_label:
    name: "PV: field 3 label"
    description: "Caption under the third PV field gauge. Default «Поле 3»."
  batt_capacity_kwh:
    name: "Battery capacity (fallback), kWh"
    description: "Used only until the inverter and BMS are read. Primary source: Ah from the inverter (register 102, set on the inverter page) × BMS module count × 51.2 V."
  home_max:
    name: "House: scale max, kW"
    description: "Currently unused: the house gauge scale is fixed at 45 kW (inverter peak power). Default 30."
  home_t1:
    name: "House: green zone end, kW"
    description: "House load gauge: green from 0 up to this value. Default 3."
  home_t2:
    name: "House: yellow zone end, kW"
    description: "Yellow from the previous threshold up to this value. Default 5."
  home_t3:
    name: "House: orange zone end, kW"
    description: "Orange up to this value, then red up to the inverter continuous max and dark red (overload) up to 45 kW. Default 25."
  pv_max:
    name: "Inverter: continuous max, kW"
    description: "Continuous inverter power: start of the red zone on the house gauge and on the total PV bar (scale up to 39 kW); also the forecast AC limit when that is not set. Default 33."
  pv_t1:
    name: "PV: yellow zone end, kW"
    description: "Total PV generation bar: yellow from 0 up to this value (little sun). Default 5."
  pv_t2:
    name: "PV: green zone end, kW"
    description: "Green from the previous threshold up to this value. Default 20."
  pv_t3:
    name: "PV: orange zone end, kW"
    description: "Orange up to this value, then red up to the inverter continuous max and dark red up to 39 kW. Default 25."
  pv_day_clear_kwh:
    name: "PV: clear-day yield, kWh"
    description: "Fallback for the autonomy forecast until statistics exist (normally the best day of the last ~10 days is used). Default 100."
  pv_ac_limit_kw:
    name: "PV: forecast AC limit, kW"
    description: "Inverter output ceiling that clips the summed per-string generation forecast. 0 or empty: the inverter continuous max is used. Default 33."
  pv_strings:
    name: "PV: strings for the forecast"
    description: "Panel geometry for the generation forecast. name: name; field: field (strings of one field are summed, empty = name); kwp: power, kW; tilt: tilt, °; azimuth: compass azimuth (0 N, 90 E, 180 S, 270 W); bifacial: rear-side gain (0.12 = +12 %); controllable: not used yet. Empty list: geometry forecast off."
  charge_max_a_limit:
    name: "Charge: total limit slider max, A"
    description: "Upper bound of the «Общий лимит» slider. Default 30 A."
  charge_grid_a_limit:
    name: "Charge: grid limit slider max, A"
    description: "Upper bound of the grid-charge slider. Default 15 A."
  charge_full_days_max:
    name: "Charge: full-charge period max, days"
    description: "Upper bound of the full-charge period slider. Default 30."
  charge_night_below_w:
    name: "Charge: night mode below, W"
    description: "PV below this → the full limit is written so the morning starts charging even without HA. Default 1000."
  charge_day_above_w:
    name: "Charge: day mode above, W"
    description: "Back to the day logic above this PV power. Must exceed the night threshold (else +500). Default 1500."
  charge_cell_cap_a:
    name: "Charge: current cap on cell imbalance, A"
    description: "Cap when the cell delta exceeds 100 mV. Default 5 A."
  charge_cell_cap_soc:
    name: "Charge: imbalance cap from SOC, %"
    description: "Below this SOC imbalance does not cut the current. Default 70."
  charge_full_tail_soc:
    name: "Charge: full-charge tail from SOC, %"
    description: "When charging to 100 %: the total limit up to this SOC, then the small tail current (last percent, cell balancing). Default 95."
  charge_full_tail_a:
    name: "Charge: full-charge tail current, A"
    description: "Actual current for the last percent of a full charge. Default 6 A (about 0.02C for 314 Ah)."
  charge_zero_on_target:
    name: "Charge: stop at the night target"
    description: "On — write 0 (stop) at the target, off — 1 (minimum). Default on."
  charge_balance_stop_v:
    name: "Charge: balancing — pulse top at cell voltage, V"
    description: "Balancing mode (dashboard switch): the highest cell is held near the top with charge pulses so the passive BMS balancer keeps working. A pulse ends when that cell reaches this voltage (or the BMS drops the charge limit; SOC 100 % is not a top), then a pause without charging. Time of Use stays off for the whole balancing. Default 3.55 V."
  charge_balance_soft_mv:
    name: "Charge: balancing — minimum current from cell delta, mV"
    description: "The first pulse uses the tail current; once the cell delta reaches this value, the current drops to the minimum (1 in the register, 2 A actual). After the first top every later pulse starts at the minimum current. Default 10 mV."
  charge_balance_soft_v:
    name: "Charge: balancing — minimum current from cell voltage, V"
    description: "Backup threshold for the delta: the same current drop if the highest cell reaches this voltage first (or the delta sensor is unavailable). Default 3.45 V."
  charge_balance_pause_min:
    name: "Charge: balancing — pause at least, min"
    description: "After the top of a pulse the current is 0 for at least this long. The next pulse starts only once this time has passed, the highest cell is down to the threshold below AND the BMS allows charging again (charge limit above 0). Default 60 min."
  charge_balance_resume_v:
    name: "Charge: balancing — next pulse from cell voltage, V"
    description: "The pause lasts while the highest cell is above this voltage (together with the time and BMS conditions). Default 3.45 V."
  charge_balance_resume_soc:
    name: "Charge: balancing — rest down to SOC, % (unused)"
    description: "Unused since 0.6.54: the BMS SOC is wrong near the top, the pause now goes by time and cell voltage. The key is kept so saved options stay valid."
  charge_balance_done_mv:
    name: "Charge: balancing — done at delta, mV"
    description: "When the cell delta at the top of a pulse (cell reached the top voltage) is at most this value, balancing is finished and the switch turns itself off. Default 40 mV."
  charge_balance_max_days:
    name: "Charge: balancing — at most, days"
    description: "This many days after it was switched on balancing turns itself off even if the delta has not reached the done threshold: the BMS balancer is weak and keeping the battery near the top for long is harmful. Default 3."
  charge_balance_max_cycles:
    name: "Charge: balancing — at most cycles (unused)"
    description: "Unused since 0.6.54: the limit is now by time (at most, days). The key is kept so saved options stay valid."
  refresh_seconds:
    name: "Wrapper file refresh, s"
    description: "How often the schematic reloads in /local/energy_schema.html (view-only page for dashboards and TVs outside ingress). The add-on panel refreshes every second regardless. Default 3."
  control_users:
    name: "Users allowed to control"
    description: "HA user display names allowed to control (ATS, contactor, generator, inverter and charge settings). Empty: everyone. Others get view-only; their name is written to the add-on log."
  bms_dashboard:
    name: "Dashboard for BMS rows"
    description: "url_path of the HA dashboard whose «Батарея» card gets the BMS rows (SOH, cells, balance, cycles) appended at start. Empty: leave dashboards alone. Default home-energy."
  ha_url:
    name: "HA URL (only with a token)"
    description: "Used only when «HA token» is set. Without a token the add-on talks to HA through the Supervisor (http://supervisor/core) and this field is ignored."
  ha_token:
    name: "HA token (normally not needed)"
    description: "Not needed: the add-on talks to HA through the Supervisor. Fallback: if a long-lived token is set, the add-on uses «HA URL» with this token instead of the Supervisor. Can be cleared."
