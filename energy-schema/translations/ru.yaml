configuration:
  title:
    name: "Заголовок"
    description: "Сейчас нигде не выводится (оставлен для совместимости). По умолчанию «Энергосистема»."
  in1_name:
    name: "Ввод 1: название"
    description: "Подпись первого ввода сети на схеме (блок ввода, АВР, выбор ввода). По умолчанию «Рыбхоз»."
  in2_name:
    name: "Ввод 2: название"
    description: "Подпись второго ввода сети на схеме (блок ввода, АВР, выбор ввода). По умолчанию «Зелёный»."
  pv1_label:
    name: "PV: подпись поля 1"
    description: "Подпись под гейджем первого поля панелей. По умолчанию «Поле 1»."
  pv2_label:
    name: "PV: подпись поля 2"
    description: "Подпись под гейджем второго поля панелей. По умолчанию «Поле 2»."
  pv3_label:
    name: "PV: подпись поля 3"
    description: "Подпись под гейджем третьего поля панелей. По умолчанию «Поле 3»."
  batt_capacity_kwh:
    name: "Ёмкость АКБ (запасная), кВт·ч"
    description: "Используется, только пока не прочитаны инвертор и BMS. Основной источник: ёмкость в А·ч из инвертора (регистр 102, задаётся на странице инвертора) × число модулей из BMS × 51,2 В."
  home_max:
    name: "Дом: максимум шкалы, кВт"
    description: "Сейчас не используется: шкала гейджа «Дом» фиксирована до 45 кВт (пиковая мощность инвертора). По умолчанию 30."
  home_t1:
    name: "Дом: конец зелёной зоны, кВт"
    description: "Гейдж потребления «Дом»: от 0 до этого значения зона зелёная. По умолчанию 3."
  home_t2:
    name: "Дом: конец жёлтой зоны, кВт"
    description: "От предыдущей границы до этого значения зона жёлтая. По умолчанию 5."
  home_t3:
    name: "Дом: конец оранжевой зоны, кВт"
    description: "Дальше оранжевая до этого значения, затем красная до длительного максимума инвертора и тёмно-красная (перегруз) до 45 кВт. По умолчанию 25."
  pv_max:
    name: "Инвертор: длительный максимум, кВт"
    description: "Длительная мощность инвертора: начало красной зоны на гейдже «Дом» и на полосе суммарной генерации PV (шкала до 39 кВт); также AC-лимит прогноза, если он не задан отдельно. По умолчанию 33."
  pv_t1:
    name: "PV: конец жёлтой зоны, кВт"
    description: "Полоса суммарной генерации PV: от 0 до этого значения зона жёлтая (мало солнца). По умолчанию 5."
  pv_t2:
    name: "PV: конец зелёной зоны, кВт"
    description: "От предыдущей границы до этого значения зона зелёная. По умолчанию 20."
  pv_t3:
    name: "PV: конец оранжевой зоны, кВт"
    description: "Дальше оранжевая до этого значения, затем красная до длительного максимума инвертора и тёмно-красная до 39 кВт. По умолчанию 25."
  pv_day_clear_kwh:
    name: "PV: выработка за ясный день, кВт·ч"
    description: "Запасное значение для прогноза автономии, пока нет статистики (обычно берётся лучший день за последние ~10 дней). По умолчанию 100."
  pv_ac_limit_kw:
    name: "PV: AC-лимит прогноза, кВт"
    description: "Потолок выдачи инвертора, по которому обрезается суммарный прогноз генерации по стрингам. 0 или пусто — берётся длительный максимум инвертора. По умолчанию 33."
  pv_strings:
    name: "PV: стринги для прогноза"
    description: "Геометрия панелей для прогноза генерации. name — имя; field — поле (стринги одного поля суммируются, пусто = name); kwp — мощность, кВт; tilt — наклон, °; azimuth — компасный азимут (0 север, 90 восток, 180 юг, 270 запад); bifacial — прибавка тыльной стороны (0.12 = +12 %); controllable — пока не используется. Пустой список — прогноз по геометрии выключен."
  charge_max_a_limit:
    name: "Заряд: потолок общего лимита, А"
    description: "Максимум ползунка «Общий лимит» на дашборде. По умолчанию 30 А."
  charge_grid_a_limit:
    name: "Заряд: потолок лимита от сети, А"
    description: "Максимум ползунка «Лимит от сети». По умолчанию 15 А."
  charge_full_days_max:
    name: "Заряд: максимум «полный заряд раз в», дней"
    description: "Максимум ползунка периода полного заряда. По умолчанию 30."
  charge_night_below_w:
    name: "Заряд: ночной режим ниже, Вт"
    description: "Если генерация PV ниже этого значения, в инвертор пишется общий лимит, чтобы утро началось с полного тока даже без связи с HA. По умолчанию 1000."
  charge_day_above_w:
    name: "Заряд: дневной режим выше, Вт"
    description: "Возврат к дневной логике, когда генерация выше этого значения. Должно быть больше ночного порога (иначе +500). По умолчанию 1500."
  charge_cell_cap_a:
    name: "Заряд: ток при разбалансе ячеек, А"
    description: "Потолок тока, когда разбег ячеек больше 100 мВ. По умолчанию 5 А."
  charge_cell_cap_soc:
    name: "Заряд: защита по разбалансу с SOC, %"
    description: "Ниже этого заряда ток по разбалансу не режется (батарея выравнивается сама). По умолчанию 70."
  charge_full_tail_soc:
    name: "Заряд: хвост полного заряда с SOC, %"
    description: "При полном заряде до 100 %: до этого SOC — «Общим лимитом», дальше — малым током хвоста (последние проценты, балансировка ячеек). По умолчанию 95."
  charge_full_tail_a:
    name: "Заряд: ток хвоста полного заряда, А"
    description: "Фактический ток на последних процентах полного заряда. По умолчанию 6 А (около 0,02C для 314 А·ч)."
  charge_zero_on_target:
    name: "Заряд: стоп на цели на ночь"
    description: "Вкл — на цели пишется 0 (стоп заряда), выкл — 1 (минимальный ток). По умолчанию вкл."
  charge_balance_stop_v:
    name: "Заряд: балансировка — верх порции по ячейке, В"
    description: "Режим «Балансировка» (переключатель на дашборде): самая высокая ячейка держится у верха порциями заряда, чтобы пассивный балансир BMS работал. Порция заканчивается, когда эта ячейка достигнет этого напряжения (или BMS снимет лимит заряда; SOC 100 % — не верх), затем пауза без заряда. Time of Use выключен всю балансировку. По умолчанию 3,55 В."
  charge_balance_soft_mv:
    name: "Заряд: балансировка — минимальный ток с разбега, мВ"
    description: "Первая порция идёт током хвоста; когда разбег ячеек достигает этого значения, ток падает до минимума (1 в регистре — 2 А факт). После первого верха все следующие порции сразу минимальным током. По умолчанию 10 мВ."
  charge_balance_soft_v:
    name: "Заряд: балансировка — минимальный ток с напряжения ячейки, В"
    description: "Запасной порог к разбегу: то же снижение тока, если самая высокая ячейка дошла до этого напряжения раньше (или сенсор разбега недоступен). По умолчанию 3,45 В."
  charge_balance_pause_min:
    name: "Заряд: балансировка — пауза не короче, мин"
    description: "После верха порции заряд 0 не меньше этого времени. Следующая порция начинается, только когда прошло это время, самая высокая ячейка опустилась до порога ниже И BMS снова разрешает заряд (лимит заряда больше 0). По умолчанию 60 мин."
  charge_balance_resume_v:
    name: "Заряд: балансировка — следующая порция с ячейки, В"
    description: "Пауза длится, пока самая высокая ячейка выше этого напряжения (вместе с условиями по времени и разрешению BMS). По умолчанию 3,45 В."
  charge_balance_resume_soc:
    name: "Заряд: балансировка — быстрый заряд ниже SOC, %"
    description: "Если батарея разрядилась (например, пропал свет) и SOC ниже этого значения, а ячейки ещё на плоской части (ниже порога минимального тока), порция идёт «Общим лимитом» — быстро к верху; минимальный ток сбрасывается и снова включается у колена. По умолчанию 97."
  charge_balance_done_mv:
    name: "Заряд: балансировка — выровнено при разбеге, мВ"
    description: "Если разбег ячеек на верху порции (ячейка дошла до напряжения верха) не больше этого значения, балансировка закончена и переключатель выключается сам. По умолчанию 40 мВ."
  charge_balance_max_days:
    name: "Заряд: балансировка — не дольше, дней"
    description: "Через столько дней от включения балансировка выключается сама, даже если разбег не дошёл до порога «выровнено»: балансир BMS слабый, а долго держать батарею у верха вредно. По умолчанию 3."
  charge_balance_max_cycles:
    name: "Заряд: балансировка — не больше циклов (не используется)"
    description: "Не используется с 0.6.54: предел теперь по времени (не дольше, дней). Ключ оставлен, чтобы сохранённые настройки не ломались."
  refresh_seconds:
    name: "Обновление файла-обёртки, с"
    description: "Как часто перезагружается схема в /local/energy_schema.html (страница для дашбордов и ТВ вне ingress, только просмотр). Панель аддона обновляется раз в секунду независимо от этого значения. По умолчанию 3."
  control_users:
    name: "Кому разрешено управление"
    description: "Отображаемые имена пользователей HA, которым разрешено управлять (АВР, контактор, генератор, настройки инвертора и заряда). Пусто — управляют все. Остальные видят только просмотр; имя такого пользователя пишется в лог аддона."
  bms_dashboard:
    name: "Дашборд для строк BMS"
    description: "url_path дашборда HA, в карточку «Батарея» которого аддон при старте дописывает строки BMS (SOH, ячейки, баланс, циклы). Пусто — дашборды не трогать. По умолчанию home-energy."
  ha_url:
    name: "Адрес HA (только вместе с токеном)"
    description: "Используется только если задан «Токен HA». Без токена аддон ходит в HA через Supervisor (http://supervisor/core), и это поле игнорируется."
  ha_token:
    name: "Токен HA (обычно не нужен)"
    description: "Не нужен: аддон ходит в HA через Supervisor. Запасной путь: если указать долгоживущий токен, аддон пойдёт по «Адрес HA» с этим токеном вместо Supervisor. Можно очистить."
